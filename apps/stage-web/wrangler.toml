name = "mirai-stage-web"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Static Assets Configuration
assets = { directory = "./dist", binding = "ASSETS" }

# R2 Bucket for large assets
[[r2_buckets]]
binding = "PUBLIC_ASSETS"
bucket_name = "mirai-assets"

# Service Binding - API Gateway Worker
[[services]]
binding = "API_GATEWAY"
service = "mirai-api-gateway"

# Environment variables (non-sensitive) - Production
[vars]
VITE_ENVIRONMENT = "production"
VITE_API_URL = "https://mirai-api-gateway.founder-968.workers.dev"
VITE_WS_URL = "wss://mirai-api-gateway.founder-968.workers.dev"
VITE_AIRI_WS_URL = ""
LOG_LEVEL = "info"

# R2 Bucket for large assets
[[env.dev.r2_buckets]]
binding = "PUBLIC_ASSETS"
bucket_name = "mirai-assets"

# Service Binding - API Gateway Worker
[[env.dev.services]]
binding = "API_GATEWAY"
service = "mirai-api-gateway"

[env.dev.vars]
VITE_ENVIRONMENT = "development"
VITE_API_URL = "http://localhost:8787"
VITE_WS_URL = "ws://localhost:8787"
VITE_AIRI_WS_URL = ""
LOG_LEVEL = "debug"

[observability]
enabled = true
