name = "mirai-stage-web"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Static Assets Configuration
assets = { directory = "./dist", binding = "ASSETS" }

# R2 Bucket for large assets
[[r2_buckets]]
binding = "PUBLIC_ASSETS"
bucket_name = "mirai-assets"

# Service Binding - API Gateway Worker
[[services]]
binding = "API_GATEWAY"
service = "mirai-api-gateway"

# Environment variables (non-sensitive) - Production
[vars]
VITE_ENVIRONMENT = "production"
# Use direct connection to api-gateway for lowest latency
# OPTION A: Subdomain approach (recommended)
VITE_API_URL = "https://api.miraichat.app"
VITE_WS_URL = "wss://api.miraichat.app"
# OPTION B: Path-based approach (alternative)
# VITE_API_URL = "https://miraichat.app"
# VITE_WS_URL = "wss://miraichat.app"
VITE_AIRI_WS_URL = ""
LOG_LEVEL = "info"

# R2 Bucket for large assets
[[env.dev.r2_buckets]]
binding = "PUBLIC_ASSETS"
bucket_name = "mirai-assets"

# Service Binding - API Gateway Worker
[[env.dev.services]]
binding = "API_GATEWAY"
service = "mirai-api-gateway"

[env.dev.vars]
VITE_ENVIRONMENT = "development"
VITE_API_URL = "http://localhost:4337"
VITE_WS_URL = "ws://localhost:4337"
VITE_AIRI_WS_URL = ""
LOG_LEVEL = "debug"

[observability]
enabled = true
