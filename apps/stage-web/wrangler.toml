name = "mirai-stage-web"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Static Assets Configuration
assets = { directory = "./dist", binding = "ASSETS" }

# R2 Bucket for large assets
[[r2_buckets]]
binding = "PUBLIC_ASSETS"
bucket_name = "mirai-assets"

# Service Binding - API Gateway Worker
[[services]]
binding = "API_GATEWAY"
service = "mirai-api-gateway"

# Service Binding - Voice Agent Worker (for WebSocket proxy)
[[services]]
binding = "VOICE_AGENT"
service = "voice-agent-container"

# Environment variables (non-sensitive) - Production
[vars]
VITE_ENVIRONMENT = "production"
# Unified domain approach - all traffic through stage-web with service bindings
# stage-web proxies /api/* to API_GATEWAY and /ws to VOICE_AGENT
# Uses internal Cloudflare routing (~0.5-2ms) instead of public HTTPS (~5-10ms)
# This provides the lowest possible latency for real-time voice streaming
VITE_API_URL = "https://miraichat.app"
VITE_WS_URL = "wss://miraichat.app"
VITE_AIRI_WS_URL = ""
LOG_LEVEL = "info"

# R2 Bucket for large assets
[[env.dev.r2_buckets]]
binding = "PUBLIC_ASSETS"
bucket_name = "mirai-assets"

# Service Binding - API Gateway Worker
[[env.dev.services]]
binding = "API_GATEWAY"
service = "mirai-api-gateway"
environment = "dev"

# Service Binding - Voice Agent Worker (for WebSocket proxy)
[[env.dev.services]]
binding = "VOICE_AGENT"
service = "voice-agent-container"
environment = "dev"

[env.dev.vars]
VITE_ENVIRONMENT = "development"
VITE_API_URL = "http://localhost:4337"
VITE_WS_URL = "ws://localhost:4337"
VITE_AIRI_WS_URL = ""
LOG_LEVEL = "debug"

[observability]
enabled = true
