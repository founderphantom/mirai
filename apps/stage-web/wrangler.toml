name = "mirai-stage-web"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# Static Assets Configuration
assets = { directory = "./dist", binding = "ASSETS" }

# R2 Bucket for large assets
[[r2_buckets]]
binding = "MIRAI_ASSETS"
bucket_name = "mirai-assets"

[observability]
enabled = true

# Route pattern - uncomment and configure when you have a domain
# routes = [
#   { pattern = "app.miraichat.ai", custom_domain = true }
# ]
