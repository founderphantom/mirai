name = "mirai-api-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "mirai-production"
database_id = "0e9b450e-3ee6-4cf8-b78b-f28d29907e81"

# R2 Bucket Binding - User Assets (Private)
[[r2_buckets]]
binding = "USER_ASSETS"
bucket_name = "mirai-user-assets"

# KV Namespace Binding - Session Cache
[[kv_namespaces]]
binding = "CACHE"
id = "0c8c90fd2bc1430ba95596589f68ae1c"

# Durable Objects Bindings
[[durable_objects.bindings]]
name = "VOICE_SESSION"
class_name = "VoiceSession"
script_name = "mirai-api-gateway"

# Environment Variables
[vars]
ENVIRONMENT = "production"
BETTER_AUTH_URL = "https://api.miraichat.app"

[observability]
enabled = true
