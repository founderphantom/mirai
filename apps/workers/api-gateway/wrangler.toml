name = "mirai-api-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "mirai-production"
database_id = "0e9b450e-3ee6-4cf8-b78b-f28d29907e81"

# R2 Bucket Binding - User Assets (Private)
[[r2_buckets]]
binding = "USER_ASSETS"
bucket_name = "mirai-user-assets"

# KV Namespace Binding - General Cache
[[kv_namespaces]]
binding = "CACHE"
id = "0c8c90fd2bc1430ba95596589f68ae1c"

# KV Namespace Binding - Voice Session Cache (short TTL)
[[kv_namespaces]]
binding = "SESSION_CACHE"
id = "f9761f3bee6d41b28b3bbb5d1355e822"

# Durable Objects - API Gateway Session Management
[[durable_objects.bindings]]
name = "VOICE_SESSION"
class_name = "VoiceSession"
script_name = "mirai-api-gateway"

# Service Binding - Voice Agent Worker
# Binds to the worker, which internally proxies to its container
[[services]]
binding = "VOICE_AGENT"
service = "voice-agent-container"

# Migrations for Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceSession"]

# Environment Variables
[vars]
ENVIRONMENT = "production"
LOG_LEVEL = "debug"
# BETTER_AUTH_URL should match your production domain
# Use custom domain if available, otherwise use workers.dev URL
BETTER_AUTH_URL = "https://mirai-api-gateway.founder-968.workers.dev"
FRONTEND_URL = "https://mirai-stage-web.founder-968.workers.dev"

# Required Secrets (set with: wrangler secret put SECRET_NAME)
# See AUTHENTICATION_SETUP.md in project root for detailed instructions
#
# - BETTER_AUTH_SECRET           (required) Generate with: npx @better-auth/cli secret
# - GOOGLE_CLIENT_ID             (required) From Google Cloud Console
# - GOOGLE_CLIENT_SECRET         (required) From Google Cloud Console
# - DISCORD_CLIENT_ID            (optional) From Discord Developer Portal
# - DISCORD_CLIENT_SECRET        (optional) From Discord Developer Portal
# - POLAR_ACCESS_TOKEN           (required) From Polar dashboard
# - POLAR_ORGANIZATION_ID        (required) From Polar dashboard
# - POLAR_WEBHOOK_SECRET         (required) From Polar dashboard
# - INWORLD_API_KEY              (required) From Inworld AI dashboard
# - INWORLD_WORKSPACE_ID         (required) From Inworld AI dashboard

[observability]
enabled = true
head_sampling_rate = 1.0
