name = "mirai-api-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "mirai-production"
database_id = "0e9b450e-3ee6-4cf8-b78b-f28d29907e81"

# R2 Bucket Binding - User Assets (Private)
[[r2_buckets]]
binding = "USER_ASSETS"
bucket_name = "mirai-user-assets"

# KV Namespace Binding - General Cache
[[kv_namespaces]]
binding = "CACHE"
id = "0c8c90fd2bc1430ba95596589f68ae1c"

# KV Namespace Binding - Voice Session Cache (short TTL)
[[kv_namespaces]]
binding = "SESSION_CACHE"
id = "f9761f3bee6d41b28b3bbb5d1355e822"

# Durable Objects Bindings
[[durable_objects.bindings]]
name = "VOICE_SESSION"
class_name = "VoiceSession"
script_name = "mirai-api-gateway"

# Container Binding - Voice Agent Runtime
#[[containers]]
#binding = "VOICE_AGENT_CONTAINER"
#image = "voice-agent-runtime:latest"
#max_instances = 10 # Scale up to 10 concurrent container instances

# Environment Variables
[vars]
ENVIRONMENT = "production"
BETTER_AUTH_URL = "https://api.miraichat.app"

[observability]
enabled = true
