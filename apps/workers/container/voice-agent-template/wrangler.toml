#:schema node_modules/wrangler/config-schema.json
name = "voice-agent-container"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Worker configuration
workers_dev = true

# Container configuration (Durable Object that runs a container)
[[containers]]
class_name = "VoiceAgentContainer"
image = "./Dockerfile"
max_instances = 10

# Durable Objects bindings
[[durable_objects.bindings]]
name = "VOICE_AGENT"
class_name = "VoiceAgentContainer"

[[durable_objects.bindings]]
name = "VOICE_SESSION"
class_name = "VoiceSession"

# Migrations (required for new Durable Objects)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceAgentContainer", "VoiceSession"]

# Environment variables (non-sensitive) - passed to container
[vars]
NODE_ENV = "production"
WS_APP_PORT = "4000"
LOG_LEVEL = "info"

# Environment-specific overrides
[env.development.vars]
NODE_ENV = "development"
LOG_LEVEL = "debug"

# Observability
[observability]
enabled = true
