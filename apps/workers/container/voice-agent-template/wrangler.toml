#:schema node_modules/wrangler/config-schema.json
name = "voice-agent-container"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Worker configuration
workers_dev = true
route = "" # Set via Cloudflare dashboard or environment

# Container configuration
[[containers]]
binding = "VOICE_AGENT"
image = "voice-agent-runtime:latest"
max_instances = 10 # Scale up to 10 concurrent container instances

# Environment variables (non-sensitive) - passed to container
[vars]
NODE_ENV = "production"
WS_APP_PORT = "4000"
LOG_LEVEL = "info"

# Environment-specific overrides
[env.staging.vars]
NODE_ENV = "staging"
LOG_LEVEL = "debug"

[env.development.vars]
NODE_ENV = "development"
LOG_LEVEL = "debug"

# Observability
[observability]
enabled = true

# Durable Objects binding (worker-level session state)
[[durable_objects.bindings]]
name = "VOICE_SESSION"
class_name = "VoiceSession"
script_name = "voice-agent-container"

# Analytics Engine binding (for container metrics)
[[analytics_engine_datasets]]
binding = "ANALYTICS"

# Build configuration
[build]
command = "yarn build"

[build.upload]
format = "service-worker"
