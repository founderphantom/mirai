#:schema node_modules/wrangler/config-schema.json
name = "voice-agent-container"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Worker configuration
workers_dev = false

# Container configuration (Durable Object that runs a container)
[[containers]]
name = "voice-agent"
class_name = "VoiceAgentContainer"
image = "./Dockerfile"
max_instances = 10

# Durable Objects bindings - Self-binding to own container
# Note: script_name is omitted for same-worker container bindings
[[durable_objects.bindings]]
name = "VOICE_AGENT"
class_name = "VoiceAgentContainer"

# Migrations have been applied - keeping for reference
# You can remove these after successful deployment
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceAgentContainer"]

# Environment variables (non-sensitive) - Production
[vars]
NODE_ENV = "production"
WS_APP_PORT = "4000"
LOG_LEVEL = "debug"

# Local Development Environment
[env.dev]

# Container configuration
[[env.dev.containers]]
name = "voice-agent"
class_name = "VoiceAgentContainer"
image = "./Dockerfile"
max_instances = 10

# Durable Objects bindings
[[env.dev.durable_objects.bindings]]
name = "VOICE_AGENT"
class_name = "VoiceAgentContainer"

# Local dev migration - only v1, skip v2 since VoiceSession doesn't exist locally
[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceAgentContainer"]

[env.dev.vars]
NODE_ENV = "development"
WS_APP_PORT = "4000"
LOG_LEVEL = "debug"

# Observability
[observability]
enabled = true
head_sampling_rate = 1.0
